<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>あなたの推しタイプはどれ?</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Hiragino Maru Gothic ProN', 'ヒラギノ丸ゴ ProN', 'Yu Gothic', sans-serif;
            background-image: url('images/school-bg.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 30px 24px;
            text-align: center;
            min-height: 90vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .page {
            display: none;
        }

        .page.active {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 26px;
        }

        /* ===== タイトルページ ===== */
        .school-plate {
            background: linear-gradient(135deg, #6b7fd7 0%, #4a5bc4 100%);
            color: #fff;
            padding: 14px 10px;
            border-radius: 10px;
            font-size: 18px;
            letter-spacing: 3px;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(74, 91, 196, 0.4);
            margin-bottom: 6px;
        }

        .title-wrap {
            position: relative;
            padding: 10px 0;
        }

        .sparkle {
            position: absolute;
            font-size: 22px;
            animation: sparkle-anim 1.6s infinite ease-in-out;
        }
        .sparkle.s1 { top: -6px; left: 8%; animation-delay: 0s; }
        .sparkle.s2 { top: 10px; right: 10%; animation-delay: 0.4s; }
        .sparkle.s3 { bottom: -4px; left: 20%; animation-delay: 0.8s; }
        .sparkle.s4 { bottom: 20px; right: 4%; animation-delay: 1.2s; }

        @keyframes sparkle-anim {
            0%, 100% { opacity: 0.3; transform: scale(0.8) rotate(0deg); }
            50% { opacity: 1; transform: scale(1.3) rotate(20deg); }
        }

        h1.main-title {
            font-size: 34px;
            background: linear-gradient(90deg, #ff8fc7, #ff6fae, #ffb3d9, #ff8fc7);
            background-size: 300% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 3s linear infinite;
            font-weight: 900;
            line-height: 1.4;
            text-shadow: 0 2px 10px rgba(255, 140, 200, 0.3);
        }

        @keyframes shine {
            0% { background-position: 0% center; }
            100% { background-position: 300% center; }
        }

        .subtitle-big {
            font-size: 17px;
            color: #555;
            margin-top: 14px;
            line-height: 1.6;
        }

        .deco-line {
            font-size: 14px;
            color: #ff6fae;
            margin: 14px 0;
            font-weight: bold;
        }

        button {
            border: none;
            border-radius: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .btn-option {
            background: linear-gradient(135deg, #ffb3d9 0%, #ff85bd 100%);
            color: white;
            box-shadow: 0 5px 14px rgba(255, 133, 189, 0.4);
            padding: 22px 20px;
            font-size: 19px;
            line-height: 1.5;
        }

        .btn-option:active {
            transform: scale(0.97);
        }

        .btn-start {
            background: linear-gradient(135deg, #ff8fc7 0%, #ff5fa0 100%);
            color: white;
            font-size: 22px;
            padding: 24px 30px;
            box-shadow: 0 6px 20px rgba(255, 95, 160, 0.45);
            animation: float 2.2s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .btn-restart {
            background: linear-gradient(135deg, #6b7fd7 0%, #4a5bc4 100%);
            color: white;
            font-size: 18px;
            padding: 18px 26px;
            box-shadow: 0 5px 16px rgba(74, 91, 196, 0.4);
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .question-title {
            font-size: 25px;
            color: #333;
            font-weight: bold;
            line-height: 1.5;
        }

        .question-counter {
            font-size: 15px;
            color: #ff6fae;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #f0d5e3;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            background: linear-gradient(90deg, #ffb3d9 0%, #ff5fa0 100%);
            transition: width 0.3s ease;
        }

        /* ===== 結果ページ ===== */
        .result-visual-wrap {
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.25);
            cursor: pointer;
        }

        .result-visual-wrap img {
            width: 100%;
            display: block;
        }

        .teaser-hint {
            font-size: 15px;
            color: #ff5fa0;
            font-weight: bold;
            margin-top: -6px;
        }

        .result-card {
            display: none;
        }
        .result-card.show {
            display: flex;
            flex-direction: column;
            gap: 18px;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ページ1: タイトル -->
        <div class="page active" id="page-title">
            <div>
                <div class="school-plate">私立 超はあこきむわ学園</div>
                <div class="title-wrap">
                    <span class="sparkle s1">✨</span>
                    <span class="sparkle s2">⭐</span>
                    <span class="sparkle s3">💫</span>
                    <span class="sparkle s4">✨</span>
                    <h1 class="main-title">あなたの<br>推しタイプは<br>どれ?</h1>
                </div>
                <p class="subtitle-big">5つの質問に答えるだけ!<br>あなたにぴったりの推しが見つかる</p>
                <p class="deco-line">♦ 診断結果は6タイプ ♦</p>
            </div>
            <button class="btn-start" onclick="startDiagnosis()">診断をはじめる ▶</button>
        </div>

        <!-- ページ2-6: 質問 -->
        <div class="page" id="page-q1">
            <div>
                <div class="question-counter">Q. 1 / 5</div>
                <div class="progress-bar"><div class="progress" style="width: 20%"></div></div>
            </div>
            <h2 class="question-title">休日の過ごし方は?</h2>
            <div class="buttons">
                <button class="btn-option" onclick="answerQuestion(1, 'A')">アクティブに外出・スポーツ・やることいっぱい</button>
                <button class="btn-option" onclick="answerQuestion(1, 'B')">のんびり室内でマイペースに過ごす</button>
            </div>
        </div>

        <div class="page" id="page-q2">
            <div>
                <div class="question-counter">Q. 2 / 5</div>
                <div class="progress-bar"><div class="progress" style="width: 40%"></div></div>
            </div>
            <h2 class="question-title">グループでのあなたの立場は?</h2>
            <div class="buttons">
                <button class="btn-option" onclick="answerQuestion(2, 'A')">盛り上げたり、目立つ方が得意</button>
                <button class="btn-option" onclick="answerQuestion(2, 'B')">そっと支えたり、影で動くタイプ</button>
            </div>
        </div>

        <div class="page" id="page-q3">
            <div>
                <div class="question-counter">Q. 3 / 5</div>
                <div class="progress-bar"><div class="progress" style="width: 60%"></div></div>
            </div>
            <h2 class="question-title">何かに没頭するとしたら?</h2>
            <div class="buttons">
                <button class="btn-option" onclick="answerQuestion(3, 'A')">一つのことを極める・深掘りする</button>
                <button class="btn-option" onclick="answerQuestion(3, 'B')">いろんなことに手を出す・器用貧乏</button>
            </div>
        </div>

        <div class="page" id="page-q4">
            <div>
                <div class="question-counter">Q. 4 / 5</div>
                <div class="progress-bar"><div class="progress" style="width: 80%"></div></div>
            </div>
            <h2 class="question-title">気分や気ままさについて、あなたはどっち?</h2>
            <div class="buttons">
                <button class="btn-option" onclick="answerQuestion(4, 'A')">気分屋・マイペース・臨機応変</button>
                <button class="btn-option" onclick="answerQuestion(4, 'B')">責任感強い・人に合わせる・計画的</button>
            </div>
        </div>

        <div class="page" id="page-q5">
            <div>
                <div class="question-counter">Q. 5 / 5</div>
                <div class="progress-bar"><div class="progress" style="width: 100%"></div></div>
            </div>
            <h2 class="question-title">疲れた時、どうしたい?</h2>
            <div class="buttons">
                <button class="btn-option" onclick="answerQuestion(5, 'A')">元気をもらいたい・誰かと一緒にいたい</button>
                <button class="btn-option" onclick="answerQuestion(5, 'B')">一人で落ち着きたい・静かに過ごしたい</button>
            </div>
        </div>

        <!-- ページ7: 結果 -->
        <div class="page" id="page-result">
            <div id="result-teaser-wrap">
                <div class="result-visual-wrap" id="result-teaser" onclick="revealResult()">
                    <img id="teaser-image" src="" alt="teaser">
                </div>
                <p class="teaser-hint">▶ タップして結果を見る</p>
            </div>

            <div class="result-card" id="result-card">
                <div class="result-visual-wrap">
                    <img id="reveal-image" src="" alt="result">
                </div>
                <button class="btn-restart" onclick="restartDiagnosis()">もう一度診断する</button>
            </div>
        </div>
    </div>

    <script>
        // 6人分のキャラクターデータ(実際の診断メーカー画像を使用)
        const characters = {
            'おき': {
                teaser: 'images/oki_teaser.png',
                reveal: 'images/oki_reveal.png'
            },
            'かほ': {
                teaser: 'images/kaho_teaser.png',
                reveal: 'images/kaho_reveal.png'
            },
            'こやなぎ': {
                teaser: 'images/koyanagi_teaser.png',
                reveal: 'images/koyanagi_reveal.png'
            },
            'はる': {
                teaser: 'images/haru_teaser.png',
                reveal: 'images/haru_reveal.png'
            },
            'りほP': {
                teaser: 'images/riho_teaser.png',
                reveal: 'images/riho_reveal.png'
            },
            'なべ': {
                teaser: 'images/nabe_teaser.png',
                reveal: 'images/nabe_reveal.png'
            }
        };

        const scores = {
            'おき': 0,
            'かほ': 0,
            'こやなぎ': 0,
            'はる': 0,
            'りほP': 0,
            'なべ': 0
        };

        // スコアリングルール(キャラ名を実名に変更)
        // おき=体育会系, かほ=知性派, こやなぎ=多才クリエイター, はる=癒し系, りほP=ママ, なべ=マイペース
        const scoringRules = {
            1: {
                'A': { 'おき': 2, 'こやなぎ': 1 },
                'B': { 'はる': 2, 'りほP': 1 }
            },
            2: {
                'A': { 'おき': 2, 'こやなぎ': 1 },
                'B': { 'りほP': 2, 'かほ': 1 }
            },
            3: {
                'A': { 'こやなぎ': 2, 'なべ': 1 },
                'B': { 'かほ': 2, 'はる': 1 }
            },
            4: {
                'A': { 'なべ': 2, 'こやなぎ': 0.5 },
                'B': { 'りほP': 2, 'かほ': 1 }
            },
            5: {
                'A': { 'おき': 1.5, 'こやなぎ': 1.5 },
                'B': { 'はる': 2, 'なべ': 1 }
            }
        };

        let currentQuestion = 1;

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }

        function startDiagnosis() {
            resetScores();
            currentQuestion = 1;
            showPage('page-q1');
        }

        function answerQuestion(question, answer) {
            const rules = scoringRules[question][answer];
            for (const [char, score] of Object.entries(rules)) {
                scores[char] += score;
            }

            if (question < 5) {
                currentQuestion = question + 1;
                showPage(`page-q${currentQuestion}`);
            } else {
                showResult();
            }
        }

        function showResult() {
            const resultChar = Object.keys(scores).reduce((a, b) =>
                scores[a] > scores[b] ? a : b
            );

            const charData = characters[resultChar];
            document.getElementById('teaser-image').src = charData.teaser;
            document.getElementById('reveal-image').src = charData.reveal;

            document.getElementById('result-teaser-wrap').style.display = 'block';
            document.getElementById('result-card').classList.remove('show');

            showPage('page-result');
        }

        function revealResult() {
            document.getElementById('result-teaser-wrap').style.display = 'none';
            document.getElementById('result-card').classList.add('show');
        }

        function resetScores() {
            for (const char of Object.keys(scores)) {
                scores[char] = 0;
            }
        }

        function restartDiagnosis() {
            startDiagnosis();
        }
    </script>
</body>
</html>
